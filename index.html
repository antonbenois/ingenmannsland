<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ingenmannsland — a film by Anton Benois and Tobias Liljedahl.">
  <title>Ingenmannsland — Anton Benois &amp; Tobias Liljedahl</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #fff; }
    body {
      margin: 0;
      padding: clamp(12px, 3vw, 36px);
      background: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100vh - 72px);
      max-height: calc(100svh - 72px);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main>
    <img src="poster.jpg" width="1000" height="1500" alt="Ingenmannsland film poster, by Anton Benois and Tobias Liljedahl">
  </main>
